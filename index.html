function contribChip(e){
  if(e.contribType==='pourcentage' && num(e.contribPct)>0) return `<span class="chip" style="color:var(--info);background:rgba(91,158,160,.18)"><i class="fa-solid fa-percent"></i>${num(e.contribPct)}% du revenu</span>`;
  return `<span class="chip" style="color:var(--accent-lt);background:rgba(212,165,116,.16)"><i class="fa-solid fa-euro-sign"></i>Montant fixe</span>`;
}
function renderEpargne(){
  const items=S.epargnes;
  const goalHtml = items.length? items.map(e=>{
    const actuel=goalActuel(e); // progression au fil de la période affichée (pas le total futur)
    const pct=e.objectif>0?Math.min(100,actuel/e.objectif*100):0;
    const done=actuel>=e.objectif;
    const contrib=epargneContribSav(e);
    const monthsLeft=contrib>0?Math.max(0,Math.ceil((e.objectif-actuel)/contrib)):0;
    const ico=TI[e.type]||'box';
    const isTontine=e.type==='Tontine';
    const tourChip=isTontine?(e.tourPris
      ?'<span class="chip" style="color:#8FB573;background:rgba(143,181,115,.18)"><i class="fa-solid fa-circle-check"></i>Tour pris</span>'
      :'<span class="chip" style="color:var(--warn);background:rgba(224,164,88,.18)"><i class="fa-solid fa-hourglass-half"></i>Tour a venir</span>'):'';
    const posInfo=isTontine&&e.participants?`Position ${e.position||'?'}/${e.participants}`:'';
    const barColor=isTontine?(e.tourPris?'linear-gradient(90deg,#6E9A52,#8FB573)':'linear-gradient(90deg,var(--accent-dk),var(--accent))'):(done?'linear-gradient(90deg,#6E9A52,#8FB573)':'linear-gradient(90deg,var(--accent-dk),var(--accent))');
    return `<div class="ep-card" onclick="openSheet('epargne','${e.id}')">
      <div class="ep-head">
        <div class="ep-ico" style="background:rgba(212,165,116,.16);color:var(--accent)"><i class="fa-solid fa-${ico}"></i></div>
        <div style="flex:1"><div class="ep-name">${esc(e.nom)}</div><div class="ep-type">${esc(e.type)}${e.compte?` · ${esc(e.compte)}`:''}</div></div>
        <div class="ep-pct" style="color:${done||e.tourPris?'#8FB573':'var(--accent-lt)'}">${isTontine?'sol':pct.toFixed(0)+'%'}</div>
      </div>
      <div class="progress"><div class="progress-bar" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="ep-foot">
        <span>${isTontine?`<b>${fmtGoal(e,actuel)}</b> cotises / ${fmtGoal(e,e.objectif)} (ta part)`:`<b>${fmtGoal(e,actuel)}</b> / ${fmtGoal(e,e.objectif)}`}</span>
        <span>${done?(isTontine?'Cycle complete':'Objectif atteint'):`+${fmtGoal(e,contrib)}/mois · ${monthsLeft} mois`}</span>
      </div>
      <div class="ic-chips" style="margin-top:9px">${tourChip}${contribChip(e)}${posInfo?`<span class="chip" style="color:var(--txt3);background:rgba(168,149,128,.14)"><i class="fa-solid fa-list-ol"></i>${posInfo}</span>`:''}${e.devise&&e.devise!==savCur()?`<span class="chip" style="color:var(--txt3);background:rgba(168,149,128,.14)"><i class="fa-solid fa-coins"></i>${e.devise}</span>`:''}</div>
      <div style="display:flex;gap:8px;margin-top:11px" onclick="event.stopPropagation()">
        <button class="btn ghost" style="margin:0;flex:1;padding:10px;font-size:12.5px" onclick="contributeToGoal('${e.id}')"><i class="fa-solid fa-plus"></i> Contribuer ce mois</button>
        ${isTontine?(e.tourPris
          ?`<button class="btn ghost" style="margin:0;flex:1;padding:10px;font-size:12.5px;border-color:var(--warn);color:var(--warn)" onclick="undoMyTurn('${e.id}')"><i class="fa-solid fa-rotate-left"></i> Annuler le tour</button>`
          :`<button class="btn" style="margin:0;flex:1;padding:10px;font-size:12.5px;background:linear-gradient(135deg,var(--good),#6E9A52)" onclick="myTurn('${e.id}')"><i class="fa-solid fa-gift"></i> C'est mon tour</button>`):''}
      </div>
      ${isTontine?`<div style="margin-top:8px" onclick="event.stopPropagation()"><button class="btn ghost" style="margin:0;width:100%;padding:9px;font-size:12px" onclick="openTontineSheet('${e.id}')"><i class="fa-solid fa-users-line"></i> Voir le cycle du sol</button></div>`:''}
    </div>`;
  }).join('') : emptyBox('Aucun objectif d\'épargne. Ajoutes-en un !','piggy-bank');
  // Virements
  const transfers=(S.transferts||[]).filter(t=>inPeriod(t,S.currentMonth)).sort((a,b)=>(a.date<b.date?1:-1));
  const transHtml = transfers.length? transfers.map(t=>`
    <div class="item-card" onclick="openSheet('transfert','${t.id}')">
      <div class="ic-top">
        <div class="ic-ico" style="background:rgba(91,158,160,.18);color:var(--info)"><i class="fa-solid fa-right-left"></i></div>
        <div class="ic-body"><div class="ic-desc">${esc(t.deCompte)} <i class="fa-solid fa-arrow-right" style="font-size:9px;color:var(--txt3)"></i> ${esc(t.versCompte)}</div>
          <div class="ic-meta"><span>${fmtDate(t.date)}</span>${t.description?`<span>·</span><span>${esc(t.description)}</span>`:''}${t.amountType==='pourcentage'?`<span>·</span><span>${num(t.contribPct)}% du revenu</span>`:''}</div></div>
        <div class="ic-amt" style="color:var(--info)">${amtLabel(t.montant,t.devise,t.taux)}</div>
        <button class="ic-del" title="Supprimer ce virement" aria-label="Supprimer" onclick="event.stopPropagation();askDeleteTransfert('${t.id}')"><i class="fa-solid fa-trash-can"></i></button>

    <div class="ep-list">${goalHtml}</div>
    <div class="section-title" style="margin-top:6px">Virements entre comptes <span style="float:right;font-weight:400;text-transform:none;color:var(--accent-lt);cursor:pointer" onclick="openSheet('transfert')">+ Virement</span></div>
    <div class="ep-list">${transHtml||emptyBox('Aucun virement ce mois-ci','right-left')}</div>
    ${dettesSection()}`;
}
/* ===== Dettes & prêts ===== */
function dettesSection(){
  const arr=S.dettes||[];
  const du=arr.filter(x=>x.type==='dette'&&x.statut!=='remboursé').reduce((s,x)=>s+num(x.montant),0);
  const prete=arr.filter(x=>x.type==='pret'&&x.statut!=='remboursé').reduce((s,x)=>s+num(x.montant),0);
  const list=arr.slice().sort((a,b)=>{ const da=a.statut==='remboursé', db=b.statut==='remboursé'; if(da!==db) return da?1:-1; return (a.date<b.date)?1:-1; });
  const rows=list.length? list.map(x=>{
    const isDette=x.type==='dette', done=x.statut==='remboursé', col=isDette?'var(--bad)':'var(--good)';
    return `<div class="item-card ${done?'cancelled':''}" onclick="openSheet('dette','${x.id}')">
      <div class="ic-top">
        <div class="ic-ico" style="background:${col}22;color:${col}"><i class="fa-solid fa-${isDette?'arrow-up-long':'arrow-down-long'}"></i></div>
        <div class="ic-body"><div class="ic-desc">${esc(x.personne||'—')}${done?' <span style="font-size:10px;font-weight:600;color:var(--good)">remboursé</span>':''}</div>
          <div class="ic-meta"><span>${isDette?'Tu dois':'On te doit'}</span>${x.dateEcheance&&!done?`<span>·</span><span style="color:var(--warn)">échéance ${fmtDate(x.dateEcheance)}</span>`:(x.date?`<span>·</span><span>${fmtDate(x.date)}</span>`:'')}${x.description?`<span>·</span><span>${esc(x.description)}</span>`:''}</div></div>
        <div class="ic-amt" style="color:${done?'var(--txt3)':col};text-align:right">${amtLabel(x.montant,x.devise,x.taux)}</div>
        <button class="ic-del" title="Supprimer" onclick="event.stopPropagation();askDeleteDette('${x.id}')"><i class="fa-solid fa-trash-can"></i></button>
      </div>
    </div>`;
  }).join('') : emptyBox('Aucune dette ni prêt','handshake');
  return `<div class="section-title" style="margin-top:6px">Dettes & prêts <span style="float:right;font-weight:400;text-transform:none;color:var(--accent-lt);cursor:pointer" onclick="openSheet('dette')">+ Ajouter</span></div>
    <div class="card"><div style="display:flex;text-align:center">
      <div style="flex:1"><div style="font-size:11px;color:var(--txt2)">Tu dois</div><div style="font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--bad)">${fmt(du)}</div></div>
      <div style="width:1px;background:var(--line);margin:2px 8px"></div>
      <div style="flex:1"><div style="font-size:11px;color:var(--txt2)">On te doit</div><div style="font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--good)">${fmt(prete)}</div></div>
      <div style="width:1px;background:var(--line);margin:2px 8px"></div>
      <div style="flex:1"><div style="font-size:11px;color:var(--txt2)">Solde net</div><div style="font-family:'Space Grotesk';font-weight:700;font-size:16px;color:${prete-du>=0?'var(--good)':'var(--bad)'}">${(prete-du>=0?'+':'')+fmt(prete-du)}</div></div>
    </div></div>
    <div class="ep-list">${rows}</div>`;
}
function detteForm(id){
  const x=id?(S.dettes.find(y=>y.id===id)||{}):{};
  const cur=x.devise||acctCur();

  <div class="field-2">
    <div class="field"><label>Montant <span class="req">*</span></label><input type="number" step="0.01" inputmode="decimal" class="input" id="dt_montant" value="${dispAmt}" placeholder="0,00"></div>

function saveDette(){
  const personne=($('#dt_personne').value||'').trim();
  if(!personne) return toast('Indique la personne','err');
  const rawAmt=num($('#dt_montant').value);
  if(rawAmt<=0) return toast('Le montant doit être positif','err');
  const dev=$('#dt_devise').value, taux=baseRateOf(dev,acctCur());
  const montant=Math.round(rawAmt*taux*100)/100;
  const data={type:$('#dt_type').value==='pret'?'pret':'dette',personne,montant,devise:dev,taux,
    date:$('#dt_date').value,dateEcheance:$('#dt_echeance').value||'',
    statut:$('#dt_statut').value==='Remboursé'?'remboursé':'en cours',description:$('#dt_desc').value.trim()};
  if(editingId){ Object.assign(S.dettes.find(x=>x.id===editingId),data); toast('Modifié','ok'); }
  else { S.dettes.push({id:uid(),...data}); toast(data.type==='dette'?'Dette ajoutée':'Prêt ajouté','ok'); }
  save(); closeSheet(); renderAll();
}
function askDeleteDette(id){
  const x=S.dettes.find(y=>y.id===id); if(!x) return;
  if(confirm(`Supprimer « ${x.personne||'sans nom'} » (${fmt(num(x.montant))}) ?`)){
    S.dettes=S.dettes.filter(y=>y.id!==id); save(); closeSheet(); renderAll(); toast('Supprimé','info');
  }
}
/* ===== Suivi Tontine / Sol : cycle, position, date estimée du tour ===== */
function openTontineSheet(id){
  const e=S.epargnes.find(x=>x.id===id); if(!e) return;
  const participants=Math.max(1,Math.round(num(e.participants)||1));
  const position=Math.max(0,Math.round(num(e.position)||0));
  const contrib=num(e.contribution);
  const cotise=goalActuel(e);
  const roundsDone=contrib>0?Math.min(participants,Math.round(cotise/contrib)):0;
  const contribDates=(S.transferts||[]).filter(t=>t.epargneId===id&&num(t.epargneDelta)>0).map(t=>t.date).filter(Boolean).sort();
  const firstDate=contribDates[0]||periodRange(currentPeriodKey()).start;
  const roundDate=i=>{ const d=isoToDate(firstDate); d.setMonth(d.getMonth()+(i-1)); return d; };
  const f=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'2-digit'});
  const turnDate=position>0?roundDate(position):null;
  const roundsLeft=position>0?Math.max(0,position-roundsDone):0;
  const roundsHTML=Array.from({length:participants},(_,i)=>i+1).map(i=>{
    const isMine=i===position, done=i<=roundsDone;
    const bg=isMine?'rgba(143,181,115,.16)':(done?'var(--s1)':'transparent'), bd=isMine?'var(--good)':'var(--line)';
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid ${bd};border-radius:10px;margin-bottom:6px;background:${bg}">
      <div style="width:26px;height:26px;border-radius:50%;background:${done?'var(--good)':'var(--s3)'};color:${done?'#fff':'var(--txt3)'};display:grid;place-items:center;font-size:11px;font-weight:700;flex:none">${i}</div>
      <div style="flex:1"><div style="font-size:12.5px;font-weight:${isMine?700:500}">Tour ${i}${isMine?' · TON TOUR':''}</div><div style="font-size:10.5px;color:var(--txt3)">${f(roundDate(i))}</div></div>
      <div style="font-size:11px;color:${done?'var(--good)':'var(--txt3)'}">${done?'cotisé':(isMine&&e.tourPris?'reçu':'à venir')}</div>
    </div>`;
  }).join('');
  $('#sheetTitle').textContent='Cycle du sol';
  $('#sheetBody').innerHTML=`
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-family:'Space Grotesk';font-weight:700;font-size:18px">${esc(e.nom)}</div>
      <div style="font-size:12px;color:var(--txt3)">${participants} participants · ${fmtGoal(e,contrib)}/tour</div>
    </div>
    <div class="card"><div style="display:flex;text-align:center">
      <div style="flex:1"><div style="font-size:11px;color:var(--txt2)">Ta position</div><div style="font-family:'Space Grotesk';font-weight:700;font-size:17px">${position||'?'} / ${participants}</div></div>
      <div style="width:1px;background:var(--line);margin:2px 8px"></div>
      <div style="flex:1"><div style="font-size:11px;color:var(--txt2)">Cotisé</div><div style="font-family:'Space Grotesk';font-weight:700;font-size:17px">${fmtGoal(e,cotise)}</div></div>
      <div style="width:1px;background:var(--line);margin:2px 8px"></div>
      <div style="flex:1"><div style="font-size:11px;color:var(--txt2)">Ta part</div><div style="font-family:'Space Grotesk';font-weight:700;font-size:17px;color:var(--accent-lt)">${fmtGoal(e,e.objectif)}</div></div>
    </div></div>
    <div class="card" style="text-align:center">
      <div style="font-size:12px;color:var(--txt2)">Ton tour</div>
      <div style="font-family:'Space Grotesk';font-weight:700;font-size:18px;color:${e.tourPris?'var(--good)':'var(--accent-lt)'}">${e.tourPris?'Déjà reçu':(turnDate?f(turnDate):'—')}</div>
      ${!e.tourPris&&position>0?`<div style="font-size:11.5px;color:var(--txt3);margin-top:2px">${roundsLeft===0?'C\'est bientôt ton tour !':'dans ~'+roundsLeft+' tour(s)'}</div>`:''}
    </div>
    <div class="section-title">Calendrier des tours</div>
    ${roundsHTML}
    <div style="font-size:10.5px;color:var(--txt3);margin:8px 0 4px;line-height:1.4">Dates estimées à partir de ta 1re cotisation, un tour par mois.</div>
    ${backRow("closeSheet()","Fermer")}`;
  $('#backdrop').classList.add('open'); $('#sheet').classList.add('open');
}

function renderStats(){

function switchSubTab(s){ statsSub=s; renderStats(); refreshCharts('stats'); }
function renderBudget(){
  const sb=spentByCat();
  const env=S.envelopeMode;
  let totB=0,totS=0;
  const rows=S.budgets.map(b=>{
    const spent=sb[b.categorie]||0;
    const bud=budgetFor(b.categorie);        // base + report si enveloppe
    const carry=env?envelopeCarryIn(b.categorie,S.currentMonth):0;
    totB+=bud; totS+=spent;
    const pct=bud>0?(spent/bud*100):0; const bc=bCol(pct); const gap=spent-bud;
    const cc=CC[b.categorie]||{color:'#A89580',icon:'ellipsis'};
    return `<div class="b-row">
      <div class="b-cat"><i class="fa-solid fa-${cc.icon}" style="background:${cc.color}22;color:${cc.color}"></i>${esc(b.categorie)}${env&&carry?`<span style="font-size:10px;color:${carry>=0?'var(--good)':'var(--bad)'};margin-left:4px">${carry>=0?'+':''}${fmt(carry)} report</span>`:''}</div>
      <div class="b-nums"><div class="real">${fmt(spent)} <span style="color:var(--txt3);font-family:'DM Sans'">/ ${fmt(bud)}</span></div>
      <div class="gap" style="color:${bc.col}">${Math.round(pct)}% · ${gap>=0?'+'+fmt(gap):fmt(gap)}</div></div>
    </div>`;
  }).join('');
  const totPct=totB>0?(totS/totB*100):0; const tbc=bCol(totPct);
  $('#statsContent').innerHTML=`${env?'<div style="font-size:11.5px;color:var(--txt2);background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:10px"><i class="fa-solid fa-envelope" style="color:var(--accent)"></i> Mode enveloppe : le non-dépensé (ou le dépassement) d\'une catégorie est reporté sur la période suivante.</div>':''}<div class="b-table">${rows}
    <div class="b-row total"><div class="b-cat"><i class="fa-solid fa-equals" style="background:var(--accent)22;color:var(--accent)"></i>Total</div>
      <div class="b-nums"><div class="real">${fmt(totS)} <span style="color:var(--txt3);font-family:'DM Sans'">/ ${fmt(totB)}</span></div>
      <div class="gap" style="color:${tbc.col}">${Math.round(totPct)}% · ${totS-totB>=0?'+'+fmt(totS-totB):fmt(totS-totB)}</div></div></div>
  </div>`;
}
function setStatsRange(n){ statsRange=n; renderGraphsHTML(); refreshCharts('stats'); }
function rangePills(){
  return `<div class="pill-row" style="margin:0 0 4px">`+[3,6,12].map(n=>`<button class="pill ${statsRange===n?'active':''}" onclick="setStatsRange(${n})">${n} mois</button>`).join('')+`</div>`;
}
function renderGraphsHTML(){
  $('#statsContent').innerHTML=`
    ${rangePills()}
    <div class="card"><h3><i class="fa-solid fa-chart-pie"></i>Dépenses par catégorie (${statsRange} mois)</h3>
      <div class="ring-wrap"><canvas id="gRing"></canvas><div class="ring-center"><span class="rc-lbl">Dépenses</span><span class="rc-val">${fmt(totalExpensesRange(statsRange))}</span></div></div>
      <div id="gRingLegend"></div></div>
    <div class="card"><h3><i class="fa-solid fa-chart-column"></i>Revenus vs Dépenses (${statsRange} mois)</h3><div class="chart-box"><canvas id="gBar"></canvas></div></div>

      <div id="gEpLegend"></div></div>

/* Légende HTML (pastille couleur + nom + montant) pour un donut. */
function legendHTML(data,fmtFn){ fmtFn=fmtFn||fmt; if(!data||!data.length) return ''; return data.map(d=>`<div class="lg-row"><span class="dot" style="background:${d.color}"></span><span class="nm">${d.icon?`<i class="fa-solid fa-${d.icon}" style="color:${d.color}"></i> `:''}${esc(d.cat)}</span><span class="amt">${fmtFn(d.val)}</span></div>`).join(''); }

function emptyBox(t,ic){ return `<div class="empty"><i class="fa-solid fa-${ic}"></i><p>${t}</p></div>`; }

/* =========================================================
   CHARTS
========================================================= */
Chart.defaults.color='#8A7560';
Chart.defaults.font.family="'DM Sans', sans-serif";
Chart.defaults.borderColor='rgba(212,165,116,.08)';
function destroy(name){ if(charts[name]){ charts[name].destroy(); delete charts[name]; } }
function destroyAll(){ Object.keys(charts).forEach(destroy); }

function makeRing(canvasId,data,fmtFn){
  fmtFn=fmtFn||fmt;
  destroy(canvasId); const el=document.getElementById(canvasId); if(!el) return;
  charts[canvasId]=new Chart(el,{type:'doughnut',
    data:{labels:data.map(d=>d.cat),datasets:[{data:data.map(d=>d.val),backgroundColor:data.map(d=>d.color),borderColor:'#FBF6EC',borderWidth:3,hoverOffset:6}]},
    options:{cutout:'70%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${fmtFn(c.raw)}`}}},animation:{duration:700}}
  });
}
function renderDashCharts(){
  const ds=catBreakdown();
  makeRing('dashRing',ds);
  const h=getHist(6);
  destroy('dashTrend'); const el=$('#dashTrend'); if(el){
    charts.dashTrend=new Chart(el,{type:'line',
      data:{labels:h.map(x=>monthLabel(x.mois).slice(0,3)),datasets:[
        {label:'Revenus',data:h.map(x=>x.revenus),borderColor:'#5C8A4A',backgroundColor:'rgba(92,138,74,.15)',tension:.4,fill:true,pointRadius:0,borderWidth:2.5},
        {label:'Dépenses',data:h.map(x=>x.depenses),borderColor:'#C0563A',backgroundColor:'rgba(192,86,58,.13)',tension:.4,fill:true,pointRadius:0,borderWidth:2.5}
      ]},
      options:lineOpts(true)});
  }
}
function lineOpts(legend){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:legend,position:'bottom',labels:{boxWidth:10,boxHeight:10,padding:12,font:{size:11}}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.raw)}`}}},
    scales:{x:{grid:{display:false}},y:{grid:{color:'rgba(212,165,116,.06)'},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}}},
    animation:{duration:700}};
}
function renderGraphCharts(){
  if(statsSub!=='graphs') return;
  const cats=catBreakdownRange(statsRange);
  makeRing('gRing',cats);
  { const lg=$('#gRingLegend'); if(lg) lg.innerHTML=legendHTML(cats,fmt); }
  const h=getHist();
  const labels=h.map(x=>monthLabel(x.mois).slice(0,3));
  destroy('gBar'); const eb=$('#gBar');
  if(eb) charts.gBar=new Chart(eb,{type:'bar',
    data:{labels:labels,datasets:[
      {label:'Revenus',data:h.map(x=>x.revenus),backgroundColor:'#5C8A4A',borderRadius:5},
      {label:'Dépenses',data:h.map(x=>x.depenses),backgroundColor:'#C0563A',borderRadius:5}]},
    options:lineOpts(true)});
  // dépenses par mois (barres)
  destroy('gDepMonth'); const edm=$('#gDepMonth');
  if(edm) charts.gDepMonth=new Chart(edm,{type:'bar',
    data:{labels:labels,datasets:[{label:'Dépenses',data:h.map(x=>x.depenses),backgroundColor:'#C0563A',borderRadius:5}]},
    options:lineOpts(false)});
  // solde cumulé
  let cum=0; const cumData=h.map(x=>{ cum+=(x.revenus-x.depenses); return cum; });
  destroy('gLine'); const el=$('#gLine'); if(el){
    const ctx=el.getContext('2d'); const g=ctx.createLinearGradient(0,0,0,170); g.addColorStop(0,'rgba(154,96,40,.2)'); g.addColorStop(1,'rgba(154,96,40,0)');
    charts.gLine=new Chart(el,{type:'line',
      data:{labels:labels,datasets:[{label:'Solde cumulé',data:cumData,borderColor:'#9A6028',backgroundColor:g,tension:.4,fill:true,borderWidth:2.5,
        pointBackgroundColor:cumData.map(v=>v<0?'#C0563A':'#9A6028'),pointBorderColor:'#FBF6EC',pointRadius:4,pointHoverRadius:6}]},
      options:lineOpts(false)});
  }
  // épargne par objectif (tontine comptée seulement si tour pris)
  const ep=S.epargnes.map((e,i)=>({cat:e.nom,val:Math.round(goalSavingsValue(e)*100)/100,color:['#D4A574','#8FB573','#5B9EA0','#C9876B','#E0A458','#B08CA8','#8B6F47','#C9B68E'][i%8],icon:e.type==='Tontine'?'users':'piggy-bank'})).filter(o=>o.val>0);
  makeRing('gEp',ep,fmtS);
  { const lg=$('#gEpLegend'); if(lg) lg.innerHTML=ep.length?legendHTML(ep,fmtS):'<div style="text-align:center;font-size:12px;color:var(--txt3);padding:8px">Aucune épargne à afficher pour cette période.</div>'; }
}
function refreshCharts(tab){
  destroyAll();
  if(tab==='dashboard') renderDashCharts();
  else if(tab==='stats') renderGraphCharts();
}

function openSheet(mode,id){
  editingId=id||null;
  const body=$('#sheetBody'), title=$('#sheetTitle');
  if(mode==='revenu'){ title.textContent=id?'Modifier le revenu':'Nouveau revenu'; body.innerHTML=venuForm(id); setTimeout(()=>initCurBlock('f_montant'),0); }
  else if(mode==='depense'){ title.textContent=id?'Modifier la dépense':'Nouvelle dépense'; body.innerHTML=depenseForm(id); setTimeout(()=>initCurBlock('d_montant'),0); }
  else if(mode==='epargne'){ title.textContent=id?'Modifier l\'objectif':'Nouvel objectif'; body.innerHTML=epargneForm(id); setTimeout(()=>{initCurBlock('e_obj');updateContribPreview();},0); }
  else if(mode==='transfert'){ title.textContent=id?'Modifier le virement':'Nouveau virement'; body.innerHTML=transfertForm(id); setTimeout(()=>{initCurBlock('t_montant');updateTransPreview();},0); }
  else if(mode==='budget'){ title.textContent='Budgets du mois'; body.innerHTML=budgetForm(); }

}

  </div>
  <div class="field"><label>Devise</label>${curBlock('f_montant',cur,r.taux)}</div>
  <div class="field"><label>Description <span class="req">*</span></label><input type="text" class="input" id="f_desc" value="${esc(r.description||'')}" placeholder="Ex. Salaire"></div>

  </div>

function reconvItem(it,old,newC){
  const f=rateOf(old)/rateOf(newC);
  it.montant=num(it.montant)*f;
  if(it.devise && it.devise!==old && CUR[it.devise]){ it.taux=baseRateOf(it.devise,newC); }
  else { it.devise=newC; it.taux=1; }
}
/* Enregistrer les devises (reconvertit les données existantes si la devise change). */
function saveDevises(){
  const newAc=$('#set_acct').value, newSv=$('#set_sav').value;
  const oldAc=acctCur(), oldSv=savCur();
  if(!S.comptes) S.comptes={};
  if(newAc!==oldAc && CUR[newAc]){
    const f=rateOf(oldAc)/rateOf(newAc);
    Object.keys(S.comptes).forEach(c=>S.comptes[c]=num(S.comptes[c])*f);
    S.revenus.forEach(r=>reconvItem(r,oldAc,newAc));
    S.depenses.forEach(d=>reconvItem(d,oldAc,newAc));
    (S.transferts||[]).forEach(t=>reconvItem(t,oldAc,newAc)); // les virements sont en devise des comptes -> reconvertir
    (S.dettes||[]).forEach(x=>reconvItem(x,oldAc,newAc)); // dettes & prêts aussi
    S.budgets.forEach(b=>b.montant=num(b.montant)*f);
    S.historique.forEach(h=>{ h.revenus=Math.round(h.revenus*f); h.depenses=Math.round(h.depenses*f); });
    S.accountsCurrency=newAc; S.baseCurrency=newAc;
  }
  if(newSv!==oldSv && CUR[newSv]){
    const f=rateOf(oldSv)/rateOf(newSv);
    S.epargnes.forEach(e=>{ e.actuel=num(e.actuel)*f; e.objectif=num(e.objectif)*f; e.contribution=num(e.contribution)*f; if(e.devise&&e.devise!==oldSv&&CUR[e.devise]){ e.taux=baseRateOf(e.devise,newSv); } else { e.devise=newSv; e.taux=1; } });
    (S.transferts||[]).forEach(t=>{ if(t.epargneDelta) t.epargneDelta=Math.round(num(t.epargneDelta)*f*100)/100; }); // garder le delta aligné sur "actuel"
    S.savingsCurrency=newSv;
  }
  save(); renderAll(); toast('Devises enregistrées','ok'); openSettingsMenu();
}

/* --- Import CSV : lit les lignes « Revenu » / « Dépense » et les ajoute aux données.
   Compatible avec le CSV exporté par l'app (et tolérant aux éditions Excel : séparateur
   ; ou , décimales avec , ou . , dates ISO ou JJ/MM/AAAA). --- */
function parseCSVLine(line,sep){
  const out=[]; let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===sep){ out.push(cur); cur=''; } else cur+=ch; }
  }
  out.push(cur); return out;
}
function csvNum(s){ if(s==null) return 0; let t=String(s).trim().replace(/\s/g,''); if(t.indexOf(',')>=0 && t.indexOf('.')<0) t=t.replace(',','.'); return num(t); }
function csvDate(s){
  if(!s) return '';
  s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}
/* Ouvre un sélecteur de fichier et renvoie le contenu texte via callback.
   L'input est attaché au DOM (fiabilité sur certains navigateurs mobiles) puis retiré. */
function pickFile(accept,onText){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept=accept;
  inp.style.position='fixed'; inp.style.left='-9999px'; inp.style.opacity='0';
  document.body.appendChild(inp);
  const cleanup=()=>{ try{ inp.remove(); }catch(_){} };
  inp.onchange=e=>{
    const file=e.target.files&&e.target.files[0];
    if(!file){ cleanup(); return; }
    const reader=new FileReader();
    reader.onload=ev=>{ cleanup(); onText(String(ev.target.result||'')); };
    reader.onerror=()=>{ cleanup(); toast('Impossible de lire le fichier','err'); };
    reader.readAsText(file);
  };
  inp.click();
}
function importCSV(){
  pickFile('.csv,text/csv',text=>{
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1); // enlève le BOM
    const sep=(text.split(';').length>=text.split(',').length)?';':',';
    const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
    if(!lines.length) return toast('Fichier CSV vide','err');
    const newR=[], newD=[]; let skipped=0;
    lines.forEach((line,idx)=>{
      const c=parseCSVLine(line,sep).map(x=>x.trim());
      const type=(c[0]||'').toLowerCase();
      if(idx===0 && (type==='type'||type==='')) return; // ligne d'en-tête
      if(type==='revenu'){
        const date=csvDate(c[1]); if(!date){ skipped++; return; }
        newR.push({id:uid(),date,description:c[2]||'Import',categorie:RC[c[3]]?c[3]:'Autre revenu',
          montant:csvNum(c[5]),devise:acctCur(),taux:1,frequence:FREQ.indexOf(c[6])>=0?c[6]:'Mensuel',
          compte:COMPTES[c[9]]?c[9]:'Compte courant',valide:true,notes:''});
      } else if(type==='dépense'||type==='depense'){
        const date=csvDate(c[1]); if(!date){ skipped++; return; }
        const cat=CC[c[3]]?c[3]:'Autres dépenses';
        newD.push({id:uid(),date,description:c[2]||'Import',categorie:cat,sousCategorie:c[4]||'',
          montant:csvNum(c[5]),devise:acctCur(),taux:1,modePaiement:PC[c[6]]?c[6]:'CB',
          statut:SC[c[7]]?c[7]:'Payé',priorite:PRC[c[8]]?c[8]:'Moyenne',
          compte:COMPTES[c[9]]?c[9]:'Compte courant',recurrent:false,notes:''});
      }
    });
    if(!newR.length && !newD.length) return toast('Aucun revenu/dépense reconnu dans ce CSV','err');
    if(!confirm(`Importer ${newR.length} revenu(s) et ${newD.length} dépense(s) depuis ce CSV ?${skipped?`\n(${skipped} ligne(s) ignorée(s) : date manquante)`:''}\n\nIls seront AJOUTÉS à tes données actuelles.`)) return;
    S.revenus.push.apply(S.revenus,newR); S.depenses.push.apply(S.depenses,newD);
    save(); closeSheet(); renderAll();
    toast(`${newR.length+newD.length} entrée(s) importée(s)`,'ok');
  });
}

function exportBackup(){

function importBackup(){
  pickFile('application/json,.json',text=>{
    let parsed;
    try{ parsed=JSON.parse(text); }
    catch(err){ return toast('Fichier illisible : ce n\'est pas une sauvegarde valide','err'); }
    // accepte le format { data:{...} } (export sauvegarde) ou l'etat brut directement
    const data=(parsed && parsed.data && typeof parsed.data==='object')?parsed.data:parsed;
    if(!data || typeof data!=='object' || !Array.isArray(data.revenus) || !Array.isArray(data.depenses)){
      return toast('Sauvegarde invalide : revenus/dépenses introuvables','err');
    }
    const nbR=data.revenus.length, nbD=data.depenses.length, nbE=Array.isArray(data.epargnes)?data.epargnes.length:0;
    if(!confirm(`Importer cette sauvegarde ?\n\n${nbR} revenu(s), ${nbD} dépense(s), ${nbE} objectif(s) d'épargne.\n\nCela remplacera toutes les données actuelles de l'application.`)) return;
    S=data;
    migrateState();
    if(!S.comptes) S.comptes={};
    Object.keys(COMPTES).forEach(c=>{ if(S.comptes[c]==null) S.comptes[c]=0; });
    save(); hideWelcome(); closeSheet(); renderAll();
    toast('Sauvegarde importée avec succès','ok');
  });
}

/* Normalise / migre un etat charge (localStorage ou sauvegarde importee). */
function migrateState(){
  // garantir la presence des tableaux attendus (sauvegardes anciennes ou partielles)
  ['revenus','depenses','epargnes','transferts','budgets','historique','dettes'].forEach(function(k){ if(!Array.isArray(S[k])) S[k]=[]; });
  // Catégories personnalisées : fusionnées dans CC/RC pour être reconnues partout (AVANT la remap ci-dessous).
  if(!S.customCatsD || typeof S.customCatsD!=='object') S.customCatsD={};
  if(!S.customCatsR || typeof S.customCatsR!=='object') S.customCatsR={};
  Object.keys(S.customCatsD).forEach(function(k){ if(!CC[k]) CC[k]=S.customCatsD[k]; });
  Object.keys(S.customCatsR).forEach(function(k){ if(!RC[k]) RC[k]=S.customCatsR[k]; });
  // migration categories : renommer les anciennes vers la nouvelle liste
  const CAT_MAP={'Logement':'Autres dépenses','Loisirs':'Loisir','Éducation':'Autres dépenses','Vêtement':'Vêtements','Vetement':'Vêtements','Impôts':'Autres dépenses','Assurances':'Autres dépenses','Autre dépense':'Autres dépenses','Soins':'Care','Épargnes':'Épargne'};
  const ACCT_MAP={'Compte joint':'Compte courant','Livret A':'Compte épargne','PEA':'Compte épargne','Compte dollar':'Compte épargne'};
  const migrateAcct=a=>COMPTES[a]?a:(ACCT_MAP[a]||'Compte courant');
  const mapAccts=function(o,keys){ keys.forEach(function(k){ if(o[k]&&!COMPTES[o[k]]) o[k]=migrateAcct(o[k]); }); };
  S.revenus.forEach(function(r){ mapAccts(r,['compte']); });
  S.depenses.forEach(function(d){ mapAccts(d,['compte']); });
  (S.transferts||[]).forEach(function(t){ mapAccts(t,['deCompte','versCompte']); });
  S.epargnes.forEach(function(e){ if(e.compte&&!COMPTES[e.compte]) e.compte=migrateAcct(e.compte); });
  if(S.comptes){ const nc={}; Object.keys(S.comptes).forEach(function(k){ const nk=migrateAcct(k); nc[nk]=(nc[nk]||0)+num(S.comptes[k]); }); S.comptes=nc; }
  const migrateCat=c=>CC[c]?c:(CAT_MAP[c]||'Autres dépenses');
  S.depenses.forEach(function(d){ if(!CC[d.categorie]) d.categorie=migrateCat(d.categorie); });
  S.budgets.forEach(function(b){ if(!CC[b.categorie]){ const nm=migrateCat(b.categorie); const ex=S.budgets.find(function(x){return x.categorie===nm;}); if(ex){ ex.montant=num(ex.montant)+num(b.montant); b.categorie='__del__'; } else { b.categorie=nm; } } });
  S.budgets=S.budgets.filter(function(b){return b.categorie!=='__del__';});
  // budgets pour nouvelles categories manquantes
  Object.keys(CC).forEach(function(c){ if(!S.budgets.find(function(b){return b.categorie===c;})) S.budgets.push({categorie:c,montant:0}); });
  // devises de reference : comptes (HTG) et epargne (USD), modifiables
  if(!S.accountsCurrency || !CUR[S.accountsCurrency]) S.accountsCurrency='HTG';
  if(!S.savingsCurrency || !CUR[S.savingsCurrency]) S.savingsCurrency='USD';
  S.baseCurrency=S.accountsCurrency;
  if(!S.rates) S.rates={};
  if(!S.currentMonth) S.currentMonth=curMonth();
  // Période budgétaire : 'calendar' (défaut) ou 'income' (ancrée sur les dates de revenu-ancre).
  if(S.periodMode!=='income') S.periodMode='calendar';
  if(!S.periodAnchorCat || !RC[S.periodAnchorCat]) S.periodAnchorCat='Salaire';
  if(!S.rolledOver || typeof S.rolledOver!=='object') S.rolledOver={};
  if(typeof S.envelopeMode!=='boolean') S.envelopeMode=false;
  // migration : ancien réglage jour-fixe -> on bascule en mode revenu si présent
  if(S.periodStartDay!=null){ if(num(S.periodStartDay)>1) S.periodMode='income'; delete S.periodStartDay; }
  if(!Array.isArray(S.transferts)) S.transferts=[];
  S.epargnes.forEach(function(e){
    if(!e.contribType) e.contribType='fixe';
    if(e.contribPct==null) e.contribPct=0;
    if(!e.compte) e.compte=(e.type==='Livret A'||e.type==='PEA')?e.type:'Compte courant';
  });
}

function init(){
  S=load();
  if(!S){ S=initData(); save(); }
  migrateState();
  // Ouvrir sur la période qui contient aujourd'hui (en mode revenu, ce n'est pas forcément le mois calendaire).
  S.currentMonth=currentPeriodKey();
  // Reconduction automatique des récurrents pour la période courante (une seule fois par période).
  if(!S.rolledOver) S.rolledOver={};
  let _rollN=0;
  if(!S.rolledOver[S.currentMonth]){ _rollN=rolloverRecurring(S.currentMonth); S.rolledOver[S.currentMonth]=true; }
  // Detecter premier lancement : pas de comptes initialises ET aucune donnee
  const hasData=S.revenus.length>0||S.depenses.length>0||S.epargnes.length>0;
  if(!S.comptes && !hasData){
    S.comptes={};
    save();
    showWelcome();
  } else {
    if(!S.comptes) S.comptes={};
    Object.keys(COMPTES).forEach(c=>{ if(S.comptes[c]==null) S.comptes[c]=0; });
    save();
    hideWelcome();
    renderAll();
    // Plus de pop-up automatique des taux au démarrage (agaçant à chaque refresh).
    // Les taux se mettent à jour manuellement dans Réglages -> Convertisseur & taux.
    if(_rollN>0) setTimeout(()=>toast(`${_rollN} entrée(s) récurrente(s) ajoutée(s) pour cette période`,'ok'),800);
  }
}

/* ===== Prompt journalier du taux de change ===== */
function rateKeyCurrencies(){
  const set={}; set[S.accountsCurrency]=1; set[S.savingsCurrency]=1;
  if(S.accountsCurrency!==S.baseCurrency) set[S.baseCurrency]=1;
  // aussi les devises utilisees dans les donnees
  S.revenus.forEach(r=>{ if(r.devise) set[r.devise]=1; });
  S.depenses.forEach(d=>{ if(d.devise) set[d.devise]=1; });
  return Object.keys(set).filter(c=>c!==S.accountsCurrency && CUR[c]);
}
function checkDailyRate(){
  const today=todayISO();
  if(S.lastRateUpdate===today) return; // deja mis a jour aujourd'hui
  const keys=rateKeyCurrencies();
  if(!keys.length) return;
  setTimeout(()=>openRatePrompt(keys),700);
}
function openRatePrompt(keys){
  const ac=acctCur();
  const rows=keys.map(c=>{
    const cur=rateOf(c)/rateOf(ac);
    return `<div class="field"><label>${c} - ${CUR[c].name}<span style="color:var(--txt3);font-weight:400"> (1 ${c} = ? ${ac})</span></label><input type="number" step="0.0001" inputmode="decimal" class="input rate-in" data-cur="${c}" value="${cur.toFixed(4)}" placeholder="${cur.toFixed(4)}"></div>`;
  }).join('');
  const body=$('#sheetBody');
  body.innerHTML=`<div style="font-size:12.5px;color:var(--txt2);margin:0 0 14px;line-height:1.5">Bien joué, c'est l'heure de mettre a jour les taux du jour !<br>Devise de reference : <b>${ac}</b>. Derniere mise a jour : ${S.lastRateUpdate?fmtDate(S.lastRateUpdate):'jamais'}.</div>${rows}`;
  $('#sheetTitle').textContent='Taux du jour';
  $('#backdrop').classList.add('open'); $('#sheet').classList.add('open');
  const saveBtn=document.createElement('button');
  saveBtn.className='btn'; saveBtn.innerHTML='<i class="fa-solid fa-check"></i> Enregistrer les taux';
  saveBtn.onclick=saveDailyRate;
  body.appendChild(saveBtn);
  const skipBtn=document.createElement('button');
  skipBtn.className='btn ghost'; skipBtn.innerHTML='Conserver les taux actuels'; skipBtn.style.marginTop='6px';
  skipBtn.onclick=()=>{ S.lastRateUpdate=todayISO(); save(); closeSheet(); };
  body.appendChild(skipBtn);
}
function saveDailyRate(){
  document.querySelectorAll('.rate-in').forEach(inp=>{
    const c=inp.dataset.cur, v=num(inp.value);
    if(v>0){
      // stocke en base EUR : 1 unite = X EUR
      S.rates[c]=v*rateOf(acctCur());
    }
  });
  S.lastRateUpdate=todayISO();
  save(); closeSheet(); renderAll();
  toast('Taux mis a jour','ok');
}

/* =========================================================
   SYNCHRONISATION CLOUD (Firebase Auth + Firestore)
   Tant que FIREBASE_CONFIG n'est pas rempli, tout est inerte
   et l'app reste 100% locale.
========================================================= */
function cloudConfigured(){
  return FIREBASE_CONFIG && typeof FIREBASE_CONFIG.apiKey==='string'
    && FIREBASE_CONFIG.apiKey.indexOf('PASTE')<0
    && FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.projectId.indexOf('PASTE')<0;
}
function initFirebase(){
  if(!cloudConfigured()){ cloudReady=false; cloudInitError='config'; return; }
  if(typeof firebase==='undefined'){ cloudReady=false; cloudInitError='sdk'; return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth();
    db=firebase.firestore();
    try{ db.settings({ignoreUndefinedProperties:true}); }catch(e){} // évite un crash de .set() si S contient une valeur undefined
    cloudReady=true; cloudInitError='';        // prêt AVANT la persistance (qui peut échouer sans bloquer le cloud)
    auth.onAuthStateChanged(onAuthChanged);
    // Cache hors-ligne : best-effort. Peut lever une exception (file://, navigation privée) — sans impact sur le cloud.
    try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  }catch(e){ cloudReady=false; cloudInitError='init'; console.warn('Firebase indisponible :',e&&e.message); }
}
function cloudRef(){ return (cloudReady&&cloudUser&&db)?db.collection('budgets').doc(cloudUser.uid):null; }
function hasRealData(st){ return !!(st && ((st.revenus&&st.revenus.length)||(st.depenses&&st.depenses.length)||(st.epargnes&&st.epargnes.length))); }

/* --- Réactions au changement d'état d'authentification --- */
function onAuthChanged(user){
  cloudUser=user||null;
  if(user){ handleSignedIn(user); }
  else { stopCloudListener(); cloudStatus='idle'; }
  updateSyncBadge();
  if(accountSheetOpen) renderAccountSheet();
}
function markLinked(uid){ if(S){ S._cloudUid=uid; persistLocal(); } }
function handleSignedIn(user){
  const ref=db.collection('budgets').doc(user.uid);
  // Lecture SERVEUR obligatoire : ne pas se fier au cache (vide hors-ligne) pour décider
  // de pousser/écraser, sinon on risque d'effacer les données du cloud.
  ref.get({source:'server'}).then(snap=>{
    const remote=snap.exists?snap.data():null;
    const remoteData=remote&&remote.state&&hasRealData(remote.state);
    const alreadyLinked = S && S._cloudUid===user.uid; // cet appareil est déjà rattaché à ce compte
    if(!remoteData){
      // rien (d'utile) dans le cloud : on y envoie les données de l'appareil
      markLinked(user.uid);
      pushNow().then(()=>toast('Compte lié : sauvegarde cloud activée','ok'));
    } else if(alreadyLinked){
      // rechargement normal / même compte : réconciliation silencieuse par date, aucun popup
      if(num(remote.updatedAt) > num(S._updatedAt)){ applyRemoteState(remote.state); }
      else { markLinked(user.uid); scheduleCloudPush(); }
    } else if(hasRealData(S)){
      // données locales JAMAIS liées à ce compte + données présentes dans le cloud : vrai choix
      const keepCloud=confirm("Des données existent à la fois dans ton compte (cloud) et sur cet appareil.\n\nOK = utiliser les données du CLOUD (recommandé sur un nouvel appareil).\nAnnuler = garder CET APPAREIL et remplacer le cloud.");
      if(keepCloud){ applyRemoteState(remote.state); toast('Données du cloud chargées','ok'); }
      else { markLinked(user.uid); pushNow().then(()=>toast('Cet appareil est sauvegardé dans le cloud','ok')); }
    } else {
      // appareil vide : on récupère simplement les données du compte
      applyRemoteState(remote.state); toast('Données restaurées depuis ton compte','ok');
    }
    startCloudListener(ref);
    if(accountSheetOpen) closeSheet();
  }).catch(e=>{
    // Hors-ligne (unavailable) : on ne montre pas d'erreur, le listener synchronisera au retour du réseau.
    if(!(e && e.code==='unavailable')) cloudErr(e);
    startCloudListener(ref);
    if(accountSheetOpen) renderAccountSheet();
  });
}
function applyRemoteState(state){
  applyingRemote=true;
  S=state;
  migrateState();
  if(!S.comptes) S.comptes={};
  Object.keys(COMPTES).forEach(c=>{ if(S.comptes[c]==null) S.comptes[c]=0; });
  if(cloudUser) S._cloudUid=cloudUser.uid;
  persistLocal();
  applyingRemote=false;
  hideWelcome();
  renderAll();
  cloudStatus='synced';
  refreshSyncUI();
}

/* --- Écoute temps réel : reçoit les changements d'un autre appareil --- */
function startCloudListener(ref){
  stopCloudListener();
  cloudUnsub=ref.onSnapshot(snap=>{
    if(!snap.exists) return;
    if(snap.metadata.hasPendingWrites) return; // notre propre écriture en attente : on ignore
    const remote=snap.data();
    if(!remote||!remote.state) return;
    const rU=num(remote.updatedAt), lU=num(S&&S._updatedAt);
    if(rU>lU){
      applyRemoteState(remote.state);
      toast('Données mises à jour depuis un autre appareil','info');
    }
  }, err=>{ /* réseau : ignoré, on retentera */ });
}
function stopCloudListener(){ if(cloudUnsub){ try{cloudUnsub();}catch(e){} cloudUnsub=null; } }

/* --- Écritures vers le cloud (avec debounce) --- */
function refreshSyncUI(){ updateSyncBadge(); if(accountSheetOpen) updateSyncLine(); }
function pushNow(){
  const ref=cloudRef(); if(!ref) return Promise.resolve();
  cloudStatus='saving'; refreshSyncUI();
  return ref.set({ state:S, updatedAt:(S&&S._updatedAt)||Date.now(), device:deviceId, at:firebase.firestore.FieldValue.serverTimestamp() })
    .then(()=>{ cloudStatus='synced'; refreshSyncUI(); })
    .catch(e=>{ cloudStatus='error'; refreshSyncUI(); });
}
function scheduleCloudPush(){
  if(applyingRemote || !cloudReady || !cloudUser) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(pushNow, 1200);
}
function cloudManualPush(){ if(!cloudRef()) return; pushNow().then(()=>{ if(cloudStatus==='error') toast('Hors-ligne : sera synchronisé au retour du réseau','info'); else toast('Sauvegardé dans le cloud','ok'); }); }

/* --- Authentification --- */

  } else {

  }

function doSignOut(){

  auth.signOut().then(()=>{ toast('Déconnecté (tes données restent sur cet appareil)','info'); if(accountSheetOpen) renderAccountSheet(); });
}
function cloudErr(e){
  const m={
    'auth/invalid-email':'E-mail invalide',
    'auth/user-not-found':'Aucun compte avec cet e-mail',
    'auth/wrong-password':'Mot de passe incorrect',
    'auth/invalid-credential':'E-mail ou mot de passe incorrect',
    'auth/email-already-in-use':'Un compte existe déjà avec cet e-mail',
    'auth/weak-password':'Mot de passe trop faible (6 min)',
    'auth/popup-closed-by-user':'Connexion Google annulée',
    'auth/popup-blocked':'La fenêtre Google a été bloquée par le navigateur',
    'auth/network-request-failed':'Problème de réseau',
    'auth/operation-not-allowed':'Méthode de connexion non activée dans Firebase',
    'auth/unauthorized-domain':'Ce domaine n\'est pas autorisé dans Firebase (Authentication → Settings)'
  };
  toast((e&&m[e.code])||('Erreur : '+((e&&e.message)||e)),'err');
}

/* --- Feuille « Compte & sauvegarde » --- */

  $('#sheetTitle').textContent='Compte & sauvegarde';

function setAuthMode(m){ const e=$('#au_email'); if(e) authEmailCache=e.value; authMode=m; renderAccountSheet(); }
function syncStatusText(){
  if(cloudStatus==='saving') return '<i class="fa-solid fa-cloud-arrow-up"></i> Sauvegarde en cours…';
  if(cloudStatus==='error') return '<i class="fa-solid fa-triangle-exclamation" style="color:var(--warn)"></i> Hors-ligne : sera synchronisé au retour du réseau';
  return '<i class="fa-solid fa-circle-check" style="color:var(--good)"></i> À jour, synchronisé';
}
function updateSyncLine(){ const el=$('#syncLine'); if(el) el.innerHTML=syncStatusText(); }
/* Petite pastille de synchro dans l'en-tête : visible seulement une fois connecté. */
function updateSyncBadge(){
  const el=$('#syncBadge'); if(!el) return;
  if(!cloudReady || !cloudUser){ el.style.display='none'; return; }
  el.style.display='grid';
  let ic,color,title;
  if(cloudStatus==='saving'){ ic='cloud-arrow-up'; color='var(--accent)'; title='Sauvegarde en cours…'; }
  else if(cloudStatus==='error'){ ic='triangle-exclamation'; color='var(--warn)'; title='Hors-ligne : synchronisation au retour du réseau'; }
  else { ic='cloud'; color='var(--good)'; title='À jour, synchronisé'; }
  el.className='sync-badge'+(cloudStatus==='saving'?' saving':'');
  el.style.color=color;
  el.title=title;
  el.innerHTML=`<i class="fa-solid fa-${ic}"></i>`;
}
function renderAccountSheet(){
  const body=$('#sheetBody'); if(!body) return;
  if(!cloudReady){
    let titre,corps;
    if(cloudInitError==='sdk'){
      titre='SDK Firebase non chargé';
      corps=`Le SDK Firebase n'a pas pu se charger. Vérifie ta <b>connexion internet</b> et que tu n'ouvres pas le fichier en <b>local (file://)</b>. La synchro nécessite l'app servie en <b>https</b> (ton site Netlify). Recharge la page une fois en ligne.`;
    } else if(cloudInitError==='init'){
      titre='Firebase indisponible';
      corps=`L'initialisation Firebase a échoué. Vérifie que le projet est actif et que la config est correcte, puis recharge la page.`;
    } else {
      titre='Synchronisation non configurée';
      corps=`Il faut renseigner la configuration Firebase dans le code (constante <b>FIREBASE_CONFIG</b>).`;
    }
    body.innerHTML=`<div style="font-size:13px;color:var(--txt2);line-height:1.6;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px">
      <b style="color:var(--txt)">${titre}</b><br>${corps}<br><br>
      En attendant, l'app fonctionne parfaitement en local, et tu peux utiliser <b>Importer / Exporter une sauvegarde</b> pour transférer tes données.</div>`;
    return;
  }
  if(cloudUser){
    const em=cloudUser.email||'Compte Google';
    body.innerHTML=`
      <div style="display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px">
        <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-dk));color:#FFFBF2;display:grid;place-items:center;font-size:18px;flex:none"><i class="fa-solid fa-user-check"></i></div>
        <div style="min-width:0"><div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(em)}</div><div style="font-size:12px;color:var(--txt3)">Connecté · sauvegarde automatique</div></div>
      </div>
      <div id="syncLine" style="font-size:12.5px;color:var(--txt2);margin:0 2px 14px;display:flex;align-items:center;gap:7px">${syncStatusText()}</div>
      <button class="btn" onclick="cloudManualPush()"><i class="fa-solid fa-cloud-arrow-up"></i> Sauvegarder maintenant</button>
      <button class="btn ghost" onclick="doSignOut()"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</button>
      <div style="font-size:11px;color:var(--txt3);margin-top:14px;line-height:1.5;text-align:center">Connecte-toi avec ce même compte sur un autre appareil pour y retrouver tes données.</div>`;
    return;
  }
  const isSignup=authMode==='signup';
  body.innerHTML=`
    <div class="subtabs" style="margin-bottom:16px">
      <button class="subtab ${!isSignup?'active':''}" onclick="setAuthMode('login')">Connexion</button>
      <button class="subtab ${isSignup?'active':''}" onclick="setAuthMode('signup')">Inscription</button>
    </div>
    <div class="field"><label>E-mail</label><input type="email" class="input" id="au_email" autocomplete="email" placeholder="toi@exemple.com" value="${esc(authEmailCache)}"></div>
    <div class="field"><label>Mot de passe</label><input type="password" class="input" id="au_pw" autocomplete="${isSignup?'new-password':'current-password'}" placeholder="6 caractères minimum"></div>
    ${isSignup?`<div class="field"><label>Confirmer le mot de passe</label><input type="password" class="input" id="au_pw2" autocomplete="new-password" placeholder="Retape ton mot de passe"></div>`:''}
    <button class="btn" onclick="doEmailAuth()"><i class="fa-solid fa-${isSignup?'user-plus':'right-to-bracket'}"></i> ${isSignup?'Créer mon compte':'Se connecter'}</button>
    ${!isSignup?`<div style="text-align:center;margin-top:10px"><span onclick="doPasswordReset()" style="font-size:12px;color:var(--accent-lt);cursor:pointer;text-decoration:underline">Mot de passe oublié ?</span></div>`:''}
    <div style="display:flex;align-items:center;gap:10px;color:var(--txt3);font-size:12px;margin:14px 0"><div style="flex:1;height:1px;background:var(--line)"></div>ou<div style="flex:1;height:1px;background:var(--line)"></div></div>
    <button class="btn ghost" onclick="doGoogleAuth()"><i class="fa-brands fa-google" style="color:#DB4437"></i> Continuer avec Google</button>
    <div style="font-size:11px;color:var(--txt3);margin-top:16px;line-height:1.5;text-align:center">Tes données restent privées : accessibles uniquement via ton compte. La connexion active la sauvegarde et la synchronisation entre tes appareils.</div>`;
}

/* ===== Service Worker PWA + mise à jour automatique ===== */
if('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')){
  let swRefreshing=false;
  const hadController=!!navigator.serviceWorker.controller; // faux à la toute première installation
  // Quand une NOUVELLE version prend le contrôle (nouveau déploiement) : on recharge l'app.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(swRefreshing || !hadController) return; // pas de rechargement à la 1re installation, pas de boucle
    swRefreshing=true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.update(); // vérifie une mise à jour dès le démarrage
      // ...et à chaque fois que l'app revient au premier plan (rouvrir depuis l'écran d'accueil).
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState==='visible') reg.update();
      });
    }).catch(()=>{});
  });
}

// Robustesse : une erreur dans init() ne doit pas empêcher l'initialisation du cloud (et inversement).
try{ init(); }catch(e){ console.error('Erreur init():',e); }
try{ initFirebase(); }catch(e){ console.error('Erreur initFirebase():',e); }
</script>
</body>
</html>
