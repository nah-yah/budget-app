<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A06A40"/><stop offset="1" stop-color="#6E4527"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A4F"/><stop offset="1" stop-color="#87583A"/></linearGradient>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C18A5C"/><stop offset="1" stop-color="#9B6539"/></linearGradient>
    <linearGradient id="blg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2DCBA"/><stop offset="1" stop-color="#E6C9A0"/></linearGradient>
  </defs>
  <!-- queue -->
  <ellipse cx="150" cy="104" rx="33" ry="62" transform="rotate(26 150 104)" fill="url(#tg)"/>
  <ellipse cx="150" cy="104" rx="20" ry="48" transform="rotate(26 150 104)" fill="#E6C9A0" opacity=".5"/>
  <!-- pieds -->
  <ellipse cx="84" cy="178" rx="16" ry="9" fill="#6E4527"/>
  <ellipse cx="118" cy="178" rx="16" ry="9" fill="#6E4527"/>
