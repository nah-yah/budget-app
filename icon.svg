  <path d="M96 34 C90 20, 104 14, 108 28 C112 18, 120 22, 112 36 Z" fill="url(#hg)"/>
  <!-- oreilles -->
  <circle cx="67" cy="45" r="15" fill="url(#hg)"/><circle cx="68" cy="47" r="8.5" fill="#E6C9A0"/>
  <circle cx="133" cy="45" r="15" fill="url(#hg)"/><circle cx="132" cy="47" r="8.5" fill="#E6C9A0"/>
