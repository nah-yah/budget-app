  <ellipse cx="72" cy="140" rx="11" ry="13" fill="#87583A"/>
  <ellipse cx="128" cy="140" rx="11" ry="13" fill="#87583A"/>
  <!-- gland / noisette -->
  <g transform="translate(100 142)"><ellipse cx="0" cy="0" rx="12" ry="14" fill="#C9876B"/><path d="M-12 -2 Q0 6 12 -2" stroke="#87583A" stroke-width="2" fill="none"/></g>
