  <ellipse cx="100" cy="92" rx="26" ry="20" fill="#F2DCBA"/>
  <g><circle cx="86" cy="80" r="8.5" fill="#3A2A1C"/><circle cx="114" cy="80" r="8.5" fill="#3A2A1C"/><circle cx="89" cy="77" r="2.8" fill="#fff"/><circle cx="117" cy="77" r="2.8" fill="#fff"/></g>
